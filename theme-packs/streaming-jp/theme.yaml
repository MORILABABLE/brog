# =============================================================
# テーマパック: streaming-jp（動画配信・日本）
#
# このファイルを差し替えれば別テーマのブログになる。
# パイプライン側のコードはテーマの中身を一切知らない。
# =============================================================

key: streaming-jp
label: 動画配信（日本）

country: jp

# ★ API の output_language は en / es / fr / tr / de のみ対応。日本語は非対応。
#    したがってタイトル・あらすじは英語で返る。
api_language: en

# ブログを書く言語。Wikidata から正式な邦題を引くラベル言語にも使う。
# 邦題は翻訳ではなく配給時に決まる固有名詞なので、推測せず権威あるソースから引く。
#   Paul → ×ポール / ○宇宙人ポール
site_language: ja

# サイトの基準タイムゾーン（UTCからの分オフセット）。日本 = +9時間 = 540。
# 開発機はJST・GitHub ActionsはUTCで動くため、日付表示と月別集計は必ずこれを経由する。
# ここを通さないと「8月3日終了」の作品が環境によって8月4日と表示される。
utc_offset_minutes: 540

show_types:
  - movie
  - series

# 対象配信サービス。
#
# `npm run catalogs` で確認した、日本で実際に取得可能な8社:
#   apple / crunchyroll / curiosity / disney / mubi / netflix / prime / zee5
#
# ★ U-NEXT / Hulu / DMM TV はこのAPIの日本カバレッジに存在しない。
#   高単価ASP案件の「この作品はU-NEXTで配信中」という導線は作れない。
#   （アフィリエイトリンク自体は貼れるが、配信状況の裏付けは取れない）
#
# id に `.subscription` を付けると見放題のみに絞られ、レンタル・購入は除外される。
# Apple TV と Prime Video は購入・レンタルが混在するため必須。
#
# supports_upcoming: 配信終了予定(expiring)・開始予定(upcoming)を要求するか。
# APIのドキュメント上は Netflix / Prime Video / Disney+ / Apple TV / Max / Mubi が対応。
#
# ★ ただし日本カタログでの実測（2026-08・6回の収集・1,089件）では、
#   expiring が実際に返ったのは Netflix と Amazon Prime Video の2社だけだった。
#
#     netflix      new 194 / removed 162 / expiring 162 / upcoming 0
#     prime-video  new 169 / removed 257 / expiring  50 / upcoming 0
#     disney-plus  new  16 / removed  76 / expiring   0 / upcoming 0
#     apple-tv     new   1 / removed   2 / expiring   0 / upcoming 0
#
#   取得上限による打ち切りではない（expiring は最大79件で、上限200に一度も達していない）。
#   upcoming は4社とも0件で、記事の「これから配信開始予定」節は一度も出力されていない。
#
#   → 配信終了「予定」記事(leaving)に載るのは実質2社。
#     Disney+ の終了は removed から「配信終了済み」記事(ended)で扱っている。
#     Apple TV+ は件数が少なすぎて記事にならない。
#     フラグを true のままにしているのは、外してもリクエストが減らない
#     （4社を1リクエストに束ねているため）一方、API側が返し始めたときに
#     気づけなくなるのを避けるため。
catalogs:
  - key: netflix
    label: Netflix
    id: netflix.subscription
    supports_upcoming: true

  - key: prime-video
    label: Amazon Prime Video
    id: prime.subscription
    supports_upcoming: true

  - key: disney-plus
    label: Disney+
    id: disney.subscription
    supports_upcoming: true

  - key: apple-tv
    label: Apple TV+
    id: apple.subscription
    supports_upcoming: true

# =============================================================
# 対象外サービスへの検索リンク
#
# U-NEXT / Hulu / DMM TV の作品別配信状況を取れるAPIは、個人ブログの予算では
# 存在しない（TMDB商用 $149/月、Watchmode $349/月）。
#
# そこで「配信中」と主張せず、各社のサイト内検索へ作品名を渡すリンクだけを出す。
#   - 他社データを使わないので規約上クリーン
#   - 断定しないので誤情報にならない
#   - 読者は1クリックで確認できる
#
# ★ URLは 2026-08-01 に実測で疎通確認済み。
#   ASPのディープリンクを取得したら url_template を差し替えれば成果計測できる。
search_links:
  - key: u-next
    label: U-NEXT
    url_template: https://video.unext.jp/freeword?query={query}

  - key: hulu-jp
    label: Hulu
    url_template: https://www.hulu.jp/search?q={query}

  - key: dmm-tv
    label: DMM TV
    url_template: https://tv.dmm.com/search/?keyword={query}

# 疎通確認済みだが未採用（リンクが増えすぎると記事が散らかるため）。
# アフィリエイト導線を増やしたければコメントを外す。
#  - key: lemino
#    label: Lemino
#    url_template: https://lemino.docomo.ne.jp/search?word={query}
#  - key: abema
#    label: ABEMA
#    url_template: https://abema.tv/search?q={query}

# --- 保留中のサービス ------------------------------------------------
# 以下はAPI上は日本で利用可能とされているが、採否を保留している。
#
#  crunchyroll : 日本国内でサービス提供しているか要確認。
#                日本の読者が契約できないサービスを記事にすると精度問題になる。
#  mubi        : アート系映画特化。ニッチだが expiring 対応。
#  curiosity   : ドキュメンタリー特化。ニッチ。
#  zee5        : インド系コンテンツ。日本の読者層と合わない。
#
# 採用する場合はここに追加する:
#  - key: crunchyroll
#    label: Crunchyroll
#    id: crunchyroll.subscription
#    supports_upcoming: false

# =============================================================
# U-NEXT（Streaming Availability API の外側にあるサービス）
#
# ★ このAPIの日本カタログに U-NEXT は存在しない（2026-08-24 再確認）。
#   一方でアフィリエイト単価は最も高い部類（1,320円）で、収益の主戦場はこちら。
#   そこで U-NEXT だけは**自前で取りに行く**。
#   経緯・法務上の整理は docs/SOURCES-UNEXT-HULU.md にある。
#
# ★ Hulu は同じことができるのに**やらない**。
#   利用規約 第3条(3) が自動化手段でのアクセスを明示的に禁止しているため。
#   Hulu は search_links の検索リンクのまま据え置く。
#
# 取得は実ブラウザ（Playwright + Edge/Chromium）で行う。
#   npm run collect:unext
#
# ジャンルとカテゴリのIDは `npm run unext:menu` で調べ直せる。
# **IDがずれると収集が静かに空振りする**ので、取得数が急に減ったらまずここを疑う。
unext:
  service_key: u-next
  label: U-NEXT

  # 1ジャンルあたり何ページ読むか（1ページ30件）。
  # 新規入荷は実測で 洋画169件(6p) / アニメ62件(3p) なので、
  # 週2回の収集なら3ページ（90件）で足りる。取りこぼすなら増やす。
  arrivals_pages: 3

  # 終了予定は「終了日の近い順」に並べて上から読む。
  # 期限(expiring_horizon_days)を越えた時点でそのジャンルを打ち切るので、
  # ここは上限であって、毎回この枚数を読むわけではない。
  expiring_pages: 2

  # 何日先までの終了予定を拾うか。
  # 45日にしているのは「翌月に終了する作品」の記事を当月中に書けるようにするため。
  expiring_horizon_days: 45

  # 遷移と遷移の間に空ける最小間隔（ミリ秒）。
  # 規約 第25条(7)「当社のサーバーに過度の負担を及ぼす行為」に触れないための設定で、
  # **速くしたくなっても下げないこと**。ここだけは自分で制御できる項目。
  min_interval_ms: 2500

  # `npm run unext:menu` の出力をそのまま貼る。
  #   arrivals … 新規入荷（カテゴリ既定の並びが PUBLIC_START_DESC のもの）
  #   all      … 全作品（終了予定を「終了日の近い順」で読むのに使う）
  # ジャンルごとに呼び方が違う（キッズは「ぜんぶ」「あたらしい」）ので、
  # 名前ではなく構造で拾っている。unext-menu.ts の pickAll / pickArrivals 参照。
  genres:
    - key: youga
      label: 洋画
      id: MNU0000131
      arrivals: MNU0000692   # 新規入荷作品
      all: MNU0000141        # すべての作品
    - key: houga
      label: 邦画
      id: MNU0000132
      arrivals: MNU0000710   # 新規入荷作品
      all: MNU0000709        # すべての作品
    - key: kaigai-drama
      label: 海外ドラマ
      id: MNU0000133
      arrivals: MNU0000726   # 新規入荷作品
      all: MNU0000725        # すべての作品
    - key: asia-drama
      label: 韓流・アジア
      id: MNU0000134
      arrivals: MNU0000740   # 新規入荷作品
      all: MNU0000739        # すべての作品
    - key: kokunai-drama
      label: 国内ドラマ
      id: MNU0000135
      arrivals: MNU0000754   # 新規入荷作品
      all: MNU0000753        # すべての作品
    - key: anime
      label: アニメ
      id: MNU0000136
      arrivals: MNU0000769   # 新規入荷作品
      all: MNU0000768        # すべての作品
    - key: kids
      label: キッズ
      id: MNU0000137
      arrivals: MNU0000788   # あたらしい
      all: MNU0000787        # ぜんぶ
    - key: tv-entame
      label: TV番組・エンタメ
      id: MNU0000138
      arrivals: MNU0000801   # 新規入荷作品
      all: MNU0000800        # すべての作品
    - key: news
      label: 報道・スペシャル
      id: MNU0000832
      arrivals: MNU0000841   # 新規入荷作品
      all: MNU0000840        # すべての作品
    - key: music
      label: 音楽・ライブ
      id: MNU0000833
      arrivals: MNU0012313   # 新規入荷の音楽作品
      all: MNU0000850        # すべての音楽作品
    - key: stage
      label: 舞台・演劇
      id: MNU0011140
      arrivals: MNU0011179   # 新規入荷作品
      all: MNU0011143        # すべての作品
