name: collect

# 配信状況の変化を収集する。
#
# 無料枠は 500リクエスト/月。週2回の実行で月あたり約250リクエストに収まる。
# 全カタログを走査する必要がないのは /changes エンドポイントのおかげ。
on:
  schedule:
    # 毎週 火・金 の 04:00 JST (= 前日 19:00 UTC)
    - cron: '0 19 * * 1,4'
  workflow_dispatch:
    inputs:
      days:
        description: '何日前までの変化を取るか'
        default: '7'
      kinds:
        description: '取得する変化の種類（カンマ区切り）'
        default: 'new,removed,expiring'

permissions:
  contents: write
  # 収集結果を Issue で知らせるために要る。
  # これが無いと通知だけが 403 で落ちる（収集自体は成功する）。
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # シークレット未登録は最も多い失敗原因。
      # 素の exit 1 だと原因が分からないので、ここで明示的に検出する。
      - name: 必要なシークレットを確認
        env:
          KEY: ${{ secrets.STREAMING_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::STREAMING_API_KEY が登録されていません"
            echo "リポジトリの Settings → Secrets and variables → Actions →"
            echo "New repository secret から STREAMING_API_KEY を登録してください。"
            exit 1
          fi
          echo "シークレット: 登録済み"

      - run: npm ci

      - name: 変化を収集
        env:
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
          DAYS: ${{ inputs.days || '7' }}
          KINDS: ${{ inputs.kinds || 'new,removed,expiring' }}
        run: npm run collect -- --days "$DAYS" --kinds "$KINDS"

      # 収集しただけでは何が増減したか分からない（サイトには出るが、
      # 運用者が能動的に見に行かないと気づけない）。Issue を立てて
      # GitHub からメールで届くようにする。変化が0件なら何も作らない。
      - name: 収集結果を通知
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Watch を外していても届くように本文で @メンションする
          NOTIFY_MENTION: ${{ github.repository_owner }}
        run: npm run notify

      # 通知が失敗しても収集結果と枠の記録は残す。
      # ここを always() にしないと、通知の不調で収集ぶんが丸ごと捨てられる。
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変化なし"
          else
            git commit -m "chore(collect): $(date -u +%Y-%m-%d)"
            git push
          fi
