name: announce

# 各社が前月末に出す「翌月の配信開始ラインナップ」の告知を取り込む。
#
# ■ collect.yml と分けている理由
# 見に行く先も、変わる頻度も違う。collect は配信APIを週2回だが、
# こちらは告知ページを1枚読むだけで、**月に一度しか中身が変わらない。**
# 週2回の定期収集に混ぜても空振りが増えるだけになる。
#
# ■ 毎日見に行く理由（2026-08-30 に月末だけ → 毎日 に変えた）
# 告知元に2つの性格があり、**どちらも毎日見ないと取りこぼす。**
#
#   月次ページ型  Prime Video / Disney+
#     前月末に1枚出る。出る日は各社まちまちで事前に分からない
#     （9月分は Prime Video が8月28日、Disney+ は月初にずれ込む年もある）。
#     出ていない日は 404 で静かに終わる。
#
#   ローリング窓型  Netflix
#     `about.netflix.com/ja/new-to-watch` は月ぶんの一覧ではなく、
#     **先頭20件・約11日先までが進んでいく窓**。月末に1回読んでも
#     月の前半しか取れない。**毎日読んで貯めて、はじめて1か月がつながる。**
#
# ★ 毎日にしてもAPIは増えない。ページの取得は配信APIを使わないし、
#   画像の引き当ては**初めて見た作品だけ**（台帳が重複を弾く）。
#   実測の増分は月20〜40リクエスト（無料枠 500/月、自動実行の常用は約250）。
#
# ■ 判定 → 取り込み → 画像 → 在庫 → 通知 → 記事
#   ① --check   告知が出ているか・記事1本ぶんの本数があるかを見る（何も書かない）
#   ② 取り込み  イベントログと台帳に記録し、画像も用意する（APIを消費する）
#   ③ 画像      **配信が始まって画像が取れるようになった告知を埋める**（APIを消費しない）
#   ④ 在庫      いま何が貯まっているかを data/UPCOMING.md に書き直す（APIを消費しない）
#   ⑤ 通知      Issue → メール。本文に記事の書き出しコマンドが入る
# ⑤のあと記事を書くのは人（`/article`）。生成まで自動化するのは P3。
#
# ★ ③④⑤は**告知が出ていない日も走らせる**。
#   ③ 画像が取れるようになるのは「配信が始まった日」で、告知が出た日とは無関係。
#   ④ 在庫は差分ではなく現在の姿なので、毎日書き直しておけば読み逃しても分かる。
#   ⑤ 通知の「まもなく見放題配信開始」は在庫から出す欄で、**配信が始まる日**に
#     知らせるためにある。告知が出た日だけ走らせると当日に何も届かない。

on:
  schedule:
    # 毎日 JST 05:00（= 前日 20:00 UTC）。
    # ★ 対象月の既定は「翌月」（collect-announce.ts の nextYearMonth）。
    #   月の途中に走る日は、Netflix のローリング窓から**翌月ぶん**だけが拾われる。
    #   当月ぶんも貯めたい場合は --month を渡して workflow_dispatch する。
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: '対象月 YYYY-MM（既定は翌月）'
      max_lookups:
        description: '画像のために作品を引く上限（1件=1APIリクエスト）'
        default: '60'

permissions:
  contents: write
  issues: write

# collect.yml / collect-unext.yml と同じグループ。data/ を全員が書くので直列に流す。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ① 出ているかを見るだけ。台帳にもイベントログにも触らない。
      #   ready / month / total / summary を後続のステップへ渡す。
      - name: 告知が出ているか見る
        id: check
        env:
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            npm run collect:announce -- --check --month "$MONTH"
          else
            npm run collect:announce -- --check
          fi

      # ② 記事1本ぶんの本数が出ているときだけ取り込む。
      #   すでに取り込み済みの日は「新しい告知はありません」で終わり、APIも消費しない。
      - name: 告知を取り込む
        if: steps.check.outputs.ready == 'true'
        env:
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
          MONTH: ${{ steps.check.outputs.month }}
          MAX_LOOKUPS: ${{ inputs.max_lookups || '60' }}
        run: npm run collect:announce -- --month "$MONTH" --max-lookups "$MAX_LOOKUPS"

      # ③ 配信が始まって画像が取れるようになった告知を埋める。
      #   ★ 告知の有無に関係なく毎日走らせる（画像が付くのは配信開始日なので）。
      #   ★ APIを消費しない。収集済みのイベントどうしを突き合わせるだけ。
      - name: 告知の画像を後から埋める
        continue-on-error: true
        run: npm run backfill:images

      # ④ 先出しの在庫を1枚に書き直す。差分ではなく現在の姿。
      #   運用者は GitHub 上の data/UPCOMING.md を見れば今の状態が分かる。
      - name: 先出しの在庫を書き出す
        continue-on-error: true
        run: npm run stock

      # ⑤ 通知。★ **告知の有無に関係なく毎日走らせる。**
      #   本文の「まもなく見放題配信開始」は在庫から出す欄で、告知が出た日ではなく
      #   **配信が始まる日**に知らせるためにある（docs/ANNOUNCEMENTS.md 4-4）。
      #   告知が出た日にしか走らせないと、肝心の当日に何も届かない。
      #   前回の通知以降の変化も、その日から始まる作品も無ければ Issue は立たない
      #   （同じ日に二度も立たない）ので、鳴りっぱなしにはならない。
      - name: 結果を通知
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_MENTION: ${{ github.repository_owner }}
        run: npm run notify

      # 通知が失敗しても取り込んだ結果は残す。
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変化なし"
          else
            git commit -m "chore(collect:announce): $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
