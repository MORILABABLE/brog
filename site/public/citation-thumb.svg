<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    「引用・取材について」のカードに出す汎用画像（2026-09-16）。

    ★ guide-thumb.svg と同じ作り。src/assets/services/citation.* を置けば自動で差し替わる
      （LeftRail.astro が serviceImage('citation') を先に見る）。
    ★ 文字・ロゴ・作品の絵は一切入れない。その場で描ける図形だけで作ってあるので、
      許諾も出典表記も要らない。
    絵柄は guide と同じ白い本文カードに、引用符の形を載せたもの。
    隣に並ぶ guide と見分けが付くよう、青い帯の代わりに引用符を置いている。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24528f"/>
      <stop offset="1" stop-color="#16305c"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#aed0ff" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <rect width="96" height="96" fill="url(#dots)"/>
  <g transform="rotate(-4 48 48)">
    <rect x="24" y="21" width="48" height="54" rx="6" fill="#ffffff"/>
    <g fill="#1f6feb" stroke="#1f6feb" stroke-width="2.8" stroke-linecap="round">
      <circle cx="36.5" cy="38" r="4.3" stroke="none"/>
      <path d="M40.6 37.5 C40.8 32.5 38.6 29.6 34.6 28.4" fill="none"/>
      <circle cx="48.5" cy="38" r="4.3" stroke="none"/>
      <path d="M52.6 37.5 C52.8 32.5 50.6 29.6 46.6 28.4" fill="none"/>
    </g>
    <rect x="32" y="50" width="32" height="4" rx="2" fill="#c9d5e6"/>
    <rect x="32" y="59" width="32" height="4" rx="2" fill="#c9d5e6"/>
    <rect x="32" y="68" width="19" height="4" rx="2" fill="#c9d5e6"/>
  </g>
</svg>
