<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    「当サイトの運営方針および活用について」のカードに出す汎用画像（2026-08-29）。

    ★ あくまで仮置き。src/assets/services/guide.* を置けば自動で差し替わる
      （LeftRail.astro が serviceImage('guide') を先に見る）。
    ★ 文字・ロゴ・作品の絵は一切入れない。その場で描ける図形だけで作ってあるので、
      許諾も出典表記も要らない（scripts/genre-art.mjs と同じ考え方）。
    絵柄はサイトそのもののミニチュア＝紺の地に点、その上に白い本文カード。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24528f"/>
      <stop offset="1" stop-color="#16305c"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#aed0ff" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="96" height="96" fill="url(#bg)"/>
  <rect width="96" height="96" fill="url(#dots)"/>
  <g transform="rotate(-4 48 48)">
    <rect x="24" y="21" width="48" height="54" rx="6" fill="#ffffff"/>
    <rect x="32" y="31" width="30" height="5" rx="2.5" fill="#1f6feb"/>
    <rect x="32" y="43" width="32" height="4" rx="2" fill="#c9d5e6"/>
    <rect x="32" y="53" width="32" height="4" rx="2" fill="#c9d5e6"/>
    <rect x="32" y="63" width="19" height="4" rx="2" fill="#c9d5e6"/>
  </g>
</svg>
